---
- name: "Phase 1: Detect router"
  hosts: localhost
  roles:
    - detect

- name: "Phase 2: Base configuration"
  hosts: target_router
  roles:
    - bootstrap
    - storage

- name: "Phase 3: Core network configuration"
  hosts: target_router
  roles:
    - dns
    - dhcp
    - firewall
    - network

- name: "Phase 4: Configure system"
  hosts: target_router
  roles:
    - adblock
    - watchdog
    - ntp
    - mdns
    - vpn
    - webui
    - packet_steering
    - sqm
    - system
