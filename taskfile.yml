---
version: "3"
tasks:
  apply:
    desc: Apply config to the router
    summary: |
      Environment variables:
        TARGET  auto, router, router_factory (default: auto)
        ROLE    single role to apply instead of full playbook

      Extra ansible-playbook args can be passed after --
    silent: true
    cmds:
      - scripts/apply.sh {{.CLI_ARGS}}

  setup:
    desc: Install Ansible dependencies
    cmds:
      - ansible-galaxy collection install -r requirements.yml

  lint:
    desc: Run linting checks on playbooks and configs
    cmds:
      - yamllint .
      - ANSIBLE_PLAYBOOK_DIR={{.ROOT_DIR}}/playbooks ansible-lint

  vault:
    desc: Open the encrypted vault file
    cmds:
      - ansible-vault edit group_vars/all/vault.yml

  firmware:
    desc: Build a custom OpenWrt image locally via Nix
    summary: |
      Target: rockchip/armv8 — FriendlyARM NanoPi R6S

      Builds the image with the OpenWrt ImageBuilder in a pinned Nix
      derivation (release + package list live in flake.nix), then copies the
      ext4 sysupgrade image into firmware/. No network build service.
    cmds:
      - nix build .#packages.x86_64-linux.firmware --out-link result
      - mkdir -p firmware
      - cp -Lf result/openwrt-*-friendlyarm_nanopi-r6s-ext4-sysupgrade.img.gz firmware/
      - 'echo "Built firmware/$(basename result/openwrt-*-friendlyarm_nanopi-r6s-ext4-sysupgrade.img.gz)"'
      - rm -f result
